name: Web

on:
  push:
    branches: [dev, main]
    paths:
      - 'web/**'
      - 'app/src/main/assets/data/**'
      - 'app/src/main/res/drawable-nodpi/**'
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'app/src/main/assets/data/**'
      - 'app/src/main/res/drawable-nodpi/**'
      - 'app/src/main/res/values*/strings.xml'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        working-directory: web
        run: npm ci

      - name: Tests (paridad + integración + accesibilidad)
        working-directory: web
        run: npm test

      - name: Build para GitHub Pages
        working-directory: web
        env:
          VITE_BASE_URL: /umafinidad/
        run: npm run build

      - name: Configurar Pages (habilita el sitio si hace falta)
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Subir artefacto de Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
